<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 2</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:black;
    }

    video{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .content{
      position:relative;
      z-index:2;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:3rem;
      font-family:Arial;
    }
  </style>
</head>

<body>

  <video autoplay loop muted playsinline>
    <source src="assets/video.mp4" type="video/mp4">
  </video>

  <div class="content">
    Bienvenue sur Page 2
  </div>

</body>
</html>
