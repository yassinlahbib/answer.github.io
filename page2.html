<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:black;
    }

    video{
      width:70%;
      max-width:900px;
      border-radius:12px;
      object-fit:cover;
    }
  </style>
</head>

<body>

  <video autoplay loop muted playsinline>
    <source src="assets/video.mp4" type="video/mp4">
  </video>

</body>
</html>
